name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (pi ${{ matrix.pi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: [locked, "1.3.0", "1.4.0"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install current Pi SDK in this job only
        if: matrix.pi != 'locked'
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: >-
          npm install --ignore-scripts --save-dev --save-exact
          "@earendil-works/pi-agent-core@$PI_VERSION"
          "@earendil-works/pi-ai@$PI_VERSION"
          "@earendil-works/pi-coding-agent@$PI_VERSION"
          "@earendil-works/pi-tui@$PI_VERSION"
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
